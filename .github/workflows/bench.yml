name: Performance Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  benchmark:
    runs-on:
  workflow_dispatch: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version:
  workflow_dispatch: '1.22'
      - name: Run Benchmarks
        run: go test -bench=. ./...
