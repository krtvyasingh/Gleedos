name: Build & Test Matrix

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on:
  workflow_dispatch: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version:
  workflow_dispatch: ${{ matrix.go }}
      - name: Test with Race Detector
        run: go test -v -race ./...
      - name: Build CLI
        run: go build -v ./cmd/gleedos
